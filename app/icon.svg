<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Dark tile so the mark is visible in light browser chrome -->
  <rect width="24" height="24" rx="5" fill="#090a0c"/>
  <!-- Fastest route -->
  <path d="M 4 20 C 9 20 15 18 20 17" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
  <!-- Safest route -->
  <path d="M 4 20 C 8 19 13 7 20 4" stroke="#e4e4e7" stroke-width="2" stroke-linecap="round"/>
  <!-- Origin dot -->
  <circle cx="4" cy="20" r="2" fill="#e4e4e7"/>
  <!-- Fastest destination — dimmed -->
  <circle cx="20" cy="17" r="1.6" fill="#e4e4e7" fill-opacity="0.5"/>
  <!-- Safest destination — green -->
  <circle cx="20" cy="4" r="2" fill="#2fb872"/>
</svg>
